
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papers Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="scoreboard">
        <h3>Score</h3>
        <p>Wins: <span id="wins">0</span></p>
        <p>Ties: <span id="ties">0</span></p>
        <p>Losses: <span id="losses">0</span></p>
        <button class="reset" onclick="resetGame()">Reset</button>
    </div>

    <div class="result-display" id="resultDisplay"></div>

    <div class="button-container">
        <button class="rock" id="rock" onclick="playGame('rock')">Rock</button>
        <button class="rock" id="paper" onclick="playGame('paper')">Paper</button>
        <button class="rock" id="scissors" onclick="playGame('scissors')">Scissors</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
